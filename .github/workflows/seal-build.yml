# Upstream commons-fileupload has no GitHub Actions CI; this workflow mirrors the
# project's own Maven build (pom.xml, commons-parent 40): JDK 8 (reference jar
# manifest Build-Jdk 1.8.0_65) + Maven 3.3.9, `mvn clean package -Prelease`
# (parent 40 binds jar:test-jar only in its release profile) with the surefire
# test suite, and non-test gates (rat/checkstyle/findbugs/pmd/clirr/...) skipped.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.3.9
        run: |
          curl -fsSL -o /tmp/maven.tgz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.3.9/apache-maven-3.3.9-bin.tar.gz \
            || curl -fsSL -o /tmp/maven.tgz https://archive.apache.org/dist/maven/maven-3/3.3.9/binaries/apache-maven-3.3.9-bin.tar.gz
          sudo tar -xzf /tmp/maven.tgz -C /opt
          echo "/opt/apache-maven-3.3.9/bin" >> "$GITHUB_PATH"

      - name: Build and test
        run: |
          SKIPS="-Drat.skip=true -Dcheckstyle.skip=true -Dfindbugs.skip=true -Dpmd.skip=true -Dcpd.skip=true \
            -Dclirr.skip=true -Danimal.sniffer.skip=true -Djapicmp.skip=true -Djacoco.skip=true \
            -Dcobertura.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dgpg.skip=true \
            -Dassembly.skipAssembly=true"
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -V -e clean package -Prelease $SKIPS -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn -B -V -e clean package -Prelease $SKIPS
          fi

      - name: Test results summary
        if: always()
        run: |
          echo "== Per-class surefire results =="
          for f in target/surefire-reports/*.txt; do sed -n 4p "$f"; done
          echo "== Skipped tests (with reasons) =="
          grep -h -B1 "<skipped" target/surefire-reports/*.xml || echo "No skipped tests."

      - name: Collect release jars
        run: |
          mkdir -p release-out
          cp target/commons-fileupload-1.3.2.jar target/commons-fileupload-1.3.2-tests.jar release-out/
          ls -l release-out

      - uses: actions/upload-artifact@v4
        with:
          name: commons-fileupload-1.3.2
          path: release-out/*.jar
          if-no-files-found: error
